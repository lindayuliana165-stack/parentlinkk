
<!DOCTYPE html>

    <section class="content">
      <h1>Komite Sekolah</h1>
      <p>Ruang koordinasi dan pemantauan kegiatan komite sekolah.</p>

      <div class="panel">

        <label class="check">
          <input type="checkbox" data-check="rapat">
          Menjadwalkan rapat koordinasi komite.

        <label class="check">
          <input type="checkbox" data-check="program">
          Menyusun program kerja komite sekolah.
        </label>

        <label class="check">
          <input type="checkbox" data-check="komunikasi">
          Menjalin komunikasi dengan orang tua.
        </label>

        <label class="check">
          <input type="checkbox" data-check="evaluasi">
          Melakukan evaluasi kegiatan sekolah.
        </label>
